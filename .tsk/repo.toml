# Optional: Hyprland monitor to focus before hooks (see `hyprctl monitors`).
# on_start_monitor = "eDP-1"

# Optional per-event hook overrides (default: .tsk/on-start.sh when that file exists):
# on_start = ".tsk/custom-start.sh"
# on_create = ".tsk/on-create.sh"
# on_restore = ".tsk/on-restore.sh"

# Untracked / local paths to seed into new linked checkouts (opt-in).
# Loaded from this registered root; copied from the live fork checkout when
# forking from current/workspace, else from this root. Do not commit secrets.
# copy_local = [".env", ".env.local"]

# First Chromium launch in a new taskspace (no saved session). Unset: derive
# the repo browse page from `url` or the git/jj origin remote, else a new tab.
# [browser]
# default_tabs = ["https://github.com/jsimonrichard/hypr-taskspace"]